<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a5d36">
  <title>CityFarm | Leaf Health AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff; color: #2b302c;
      display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    }
    header {
      width: 100%; background: #1a5d36; color: #ffffff;
      padding: 16px 20px; text-align: center;
    }
    header h1 { margin: 0; font-size: 22px; }
    main { width: 100%; max-width: 500px; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; }
    .camera-container {
      position: relative; width: 100%; aspect-ratio: 4 / 3;
      background: #0d1a12; border-radius: 16px; overflow: hidden;
      display: flex; justify-content: center; align-items: center;
    }
    video, #photo { width: 100%; height: 100%; object-fit: cover; }
    .viewfinder {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; display: flex; justify-content: center; align-items: center;
    }
    .viewfinder-box {
      width: 70%; height: 70%;
      border: 2px dashed rgba(255, 255, 255, 0.65); border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.25);
    }
    .live-tag {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(26, 93, 54, 0.9); color: #ffffff;
      padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600;
      z-index: 10;
    }
    .status-banner {
      background: #f4f8f5; border-left: 4px solid #1a5d36;
      padding: 12px 14px; border-radius: 6px; font-size: 14px; text-align: left;
    }
    button {
      border: none; border-radius: 10px; padding: 14px 10px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      background: #1a5d36; color: #ffffff; width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>CityFarm | Leaf Health AI</h1>
  </header>
  <main>
    <div class="camera-container">
      <div id="liveTag" class="live-tag">Camera Offline</div>
      <video id="video" autoplay muted playsinline></video>
      <div class="viewfinder"><div class="viewfinder-box"></div></div>
    </div>
    <div class="status-banner" id="statusText">Tap <strong>Start Camera</strong> to test camera stream.</div>
    <button id="startBtn">Start Camera</button>
  </main>

  <script>
    const video = document.getElementById("video");
    const startBtn = document.getElementById("startBtn");
    const statusText = document.getElementById("statusText");
    const liveTag = document.getElementById("liveTag");

    startBtn.addEventListener("click", async () => {
      statusText.textContent = "Requesting camera stream...";
      startBtn.disabled = true;

      try {
        // Simple Safari-friendly video constraints
        const constraints = {
          audio: false,
          video: { facingMode: "environment" }
        };

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        
        // Explicit play call for iOS Safari
        await video.play();

        statusText.textContent = "Camera active successfully!";
        liveTag.textContent = "Live Camera Active";
        startBtn.style.display = "none";
      } catch (err) {
        console.error("Camera Error:", err);
        statusText.innerHTML = "<span style='color: red;'>Camera Error: " + err.name + " - " + err.message + "</span>";
        startBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
